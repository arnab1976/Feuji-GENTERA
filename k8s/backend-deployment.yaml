apiVersion: apps/v1
kind: Deployment
metadata:
  name: feuji-backend
  namespace: feuji-llm-kit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: feuji-backend
  template:
    metadata:
      labels:
        app: feuji-backend
    spec:
      serviceAccountName: feuji-backend-sa
      containers:
        - name: backend
          image: feuji/llm-kit-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: feuji-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: feuji-secrets
                  key: redis-url
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: feuji-backend-svc
  namespace: feuji-llm-kit
spec:
  selector:
    app: feuji-backend
  ports:
    - port: 8000
      targetPort: 8000
