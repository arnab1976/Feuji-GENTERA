name: Feuji LLM Kit + OPTIMA-AI CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: feuji/llm-kit

jobs:
  # ── Backend Tests ──────────────────────────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: cd backend && pip install -r requirements.txt
      - name: Run backend tests
        run: cd backend && pytest tests/ -v --tb=short
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test_pass@localhost:5432/test_db

  # ── Frontend Tests ─────────────────────────────────────────────────────────
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Type check
        run: cd frontend && npx tsc --noEmit
      - name: Run tests
        run: cd frontend && npm test -- --run

  # ── Build & Push Docker Images ─────────────────────────────────────────────
  build:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/feuji/llm-kit-backend:latest,ghcr.io/feuji/llm-kit-backend:${{ github.sha }}
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: production
          push: true
          tags: ghcr.io/feuji/llm-kit-frontend:latest,ghcr.io/feuji/llm-kit-frontend:${{ github.sha }}

  # ── Deploy (2-approver gate — Stage 9 requirement) ─────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://llmkit.feuji.com
    steps:
      - name: Deploy to Kubernetes
        run: |
          echo "Deploying version ${{ github.sha }}"
          # kubectl set image deployment/feuji-backend backend=ghcr.io/feuji/llm-kit-backend:${{ github.sha }}
          # kubectl set image deployment/feuji-frontend frontend=ghcr.io/feuji/llm-kit-frontend:${{ github.sha }}
