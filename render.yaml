# Render Blueprint — Web Service (backend)
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: Feuji-GENTERA
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHONPATH
        value: /app
      - key: APP_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
